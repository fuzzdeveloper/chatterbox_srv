<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS Client</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e; color: #e0e0e0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .container {
    background: #16213e; border-radius: 12px; padding: 32px;
    width: 100%; max-width: 600px; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  h1 { text-align: center; margin-bottom: 24px; color: #e94560; font-size: 1.5rem; }
  label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #a0a0b0; font-weight: 600; }
  .row {
    display: flex; gap: 8px; align-items: center; margin-bottom: 16px;
  }
  input[type="text"], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid #2a3a5c;
    border-radius: 8px; background: #0f1a30; color: #e0e0e0;
    font-size: 0.95rem; outline: none; transition: border-color 0.2s;
  }
  input[type="text"]:focus, textarea:focus, select:focus {
    border-color: #e94560;
  }
  textarea { resize: vertical; min-height: 120px; font-family: inherit; }
  button {
    padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 0.9rem; font-weight: 600; transition: all 0.2s; white-space: nowrap;
  }
  .btn-refresh { background: #2a3a5c; color: #e0e0e0; flex-shrink: 0; }
  .btn-refresh:hover { background: #3a4a6c; }
  .btn-speak {
    width: 100%; padding: 14px; margin-top: 8px;
    background: #e94560; color: #fff; font-size: 1rem;
  }
  .btn-speak:hover:not(:disabled) { background: #ff5a75; }
  .btn-speak:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-download:hover:not(:disabled) { background: #3a4a6c; }
  select { flex: 1; }
  .slider-row {
    display: flex; gap: 10px; align-items: center; margin-bottom: 16px;
  }
  .slider-row input[type="range"] { flex: 1; }
  .slider-value {
    min-width: 3.5em; text-align: right; font-size: 0.85rem;
    color: #e94560; font-weight: 600;
  }
  .status {
    margin-top: 16px; padding: 10px; border-radius: 8px;
    font-size: 0.85rem; text-align: center; display: none;
  }
  .status.info { display: block; background: #2a3a5c; }
  .status.error { display: block; background: #5c2a2a; color: #ff8080; }
  .status.success { display: block; background: #2a5c3a; color: #80ff80; }
</style>
</head>
<body>
<div class="container">
  <h1>🔊 TTS Client</h1>



  <label for="voiceSelect" style="margin-top:8px;">Voice</label>
  <div class="row">
    <select id="voiceSelect"><option value="">— loading —</option></select>
    <button class="btn-refresh" id="refreshBtn" title="Refresh voices">↻</button>
  </div>

  <label for="textInput">Text</label>
  <textarea id="textInput" placeholder="Enter text to speak...">Hello, this is a test.</textarea>

  <div style="margin-top:12px;">
    <label for="temperatureSlider">temperature</label>
    <div class="slider-row">
      <input type="range" id="temperatureSlider" min="0.0" max="2.0" step="0.01" value="0.7">
      <span class="slider-value" id="temperatureValue">0.70</span>
    </div>
    <label for="exaggerationSlider">exaggeration</label>
    <div class="slider-row">
      <input type="range" id="exaggerationSlider" min="0.0" max="2.0" step="0.01" value="0.5">
      <span class="slider-value" id="exaggerationValue">0.50</span>
    </div>
    <label for="cfgweightSlider">cfgweight</label>
    <div class="slider-row">
      <input type="range" id="cfgweightSlider" min="0.0" max="1.0" step="0.01" value="0.5">
      <span class="slider-value" id="cfgweightValue">0.50</span>
    </div>
  </div>

  <button class="btn-speak" id="speakBtn">🔊 Speak</button>

  <div class="row" style="margin-top:12px;">
    <button class="btn-download" id="downloadBtn" style="flex:1;display:none;background:#2a3a5c;color:#e0e0e0;">💾 Download Audio</button>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
const $ = id => document.getElementById(id);

let voices = [];
let isSpeaking = false;
let lastAudioUrl = null;
let lastAudioBlob = null;

function setStatus(msg, type = 'info') {
  const el = $('status');
  el.textContent = msg;
  el.className = `status ${type}`;
}

async function loadVoices() {
  try {
    setStatus('Loading voices...', 'info');
    const resp = await fetch('/v1/audio/voices', { signal: AbortSignal.timeout(5000) });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    voices = Array.isArray(data) ? data : (data.voices || []);

    $('voiceSelect').innerHTML = '';
    if (voices.length === 0) {
      $('voiceSelect').innerHTML = '<option value="">— no voices found —</option>';
      setStatus('No voices returned', 'error');
      return;
    }
    // Handle both [{id, name}, ...] and simple string arrays
    const isObj = typeof voices[0] === 'object';
    voices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = isObj ? v.id : v;
      opt.textContent = isObj ? (v.name || v.id) : v;
      $('voiceSelect').appendChild(opt);
    });
    setStatus(`Loaded ${voices.length} voice(s)`, 'success');
  } catch (e) {
    console.error('Failed to load voices:', e);
    setStatus(`Failed: ${e.message}`, 'error');
    $('voiceSelect').innerHTML = '<option value="">— failed to load —</option>';
  }
}

async function speak() {
  if (isSpeaking) return;
  const text = $('textInput').value.trim();
  const voice = $('voiceSelect').value;

  if (!text) { setStatus('Please enter some text', 'error'); return; }

  isSpeaking = true;
  $('speakBtn').disabled = true;
  setStatus('Requesting speech...', 'info');

  try {
    const temperature = parseFloat($('temperatureValue').textContent);
    const exaggeration = parseFloat($('exaggerationValue').textContent);
    const cfgweight = parseFloat($('cfgweightValue').textContent);
    const body = { input: text, voice, temperature, exaggeration, cfgweight };
    const resp = await fetch('/v1/audio/speech', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${errText.slice(0, 200)}`);
    }

    setStatus('Playing audio...', 'info');
    lastAudioBlob = await resp.blob();
    if (lastAudioUrl) URL.revokeObjectURL(lastAudioUrl);
    lastAudioUrl = URL.createObjectURL(lastAudioBlob);
    const audio = new Audio(lastAudioUrl);

    audio.onended = () => {
      isSpeaking = false;
      $('speakBtn').disabled = false;
      $('downloadBtn').style.display = '';
      setStatus('Done — click Download to save', 'success');
    };
    audio.onerror = () => {
      isSpeaking = false;
      $('speakBtn').disabled = false;
      setStatus('Audio playback error', 'error');
    };

    await audio.play();
  } catch (e) {
    console.error('Speech failed:', e);
    isSpeaking = false;
    $('speakBtn').disabled = false;
    setStatus(`Error: ${e.message}`, 'error');
  }
}

$('temperatureSlider').addEventListener('input', e => {
  $('temperatureValue').textContent = parseFloat(e.target.value).toFixed(2);
});
$('exaggerationSlider').addEventListener('input', e => {
  $('exaggerationValue').textContent = parseFloat(e.target.value).toFixed(2);
});
$('cfgweightSlider').addEventListener('input', e => {
  $('cfgweightValue').textContent = parseFloat(e.target.value).toFixed(2);
});

// Download button
$('downloadBtn').addEventListener('click', () => {
  if (!lastAudioBlob) return;
  const a = document.createElement('a');
  a.href = lastAudioUrl;
  a.download = `tts-${Date.now()}.wav`;
  a.click();
});

// Init
$('refreshBtn').addEventListener('click', loadVoices);
$('speakBtn').addEventListener('click', speak);
$('textInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); speak(); }
});

// Load voices on startup
loadVoices();
</script>
</body>
</html>
